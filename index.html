<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport: width=device-width, initial-scale=1 is required for correct
    mobile rendering. user-scalable=no prevents accidental pinch-zoom during
    gameplay. The Phaser Scale Manager handles the actual canvas sizing.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#130E14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">

  <title>Scrap Car Runner</title>

  <style>
    /* Reset: fill the entire viewport with no scroll, no margin.
       The Phaser canvas will be centred inside this black body. */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #130E14; /* palette ink_0 (src/game/assets/palette.ts) */
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none; /* Prevents browser scroll/gesture interfering with game input */
    }

    /* Phaser places its canvas directly inside body. The canvas is sized by Phaser as an exact
       integer number of device pixels per art pixel (docs/04 §4); these rules guarantee the
       browser upscales it with nearest-neighbor, never smoothing. `pixelated` is declared last so
       it wins wherever supported; `crisp-edges` is the fallback for engines without it. */
    canvas {
      display: block;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
